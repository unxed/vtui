name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    env:
      # vtui is a cgo-free project: every backend reaches libc, X11, Wayland
      # and the GPU through goffi rather than through a C toolchain. Pinning
      # this keeps all three runners on the same configuration instead of
      # letting each one decide by whether it happens to ship a compiler --
      # and it is what keeps bindings/c/cabi, the one cgo package in the
      # tree, out of a build that is not asking for the C bindings.
      CGO_ENABLED: 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # go.mod sets the minimum language version, while govulncheck checks the
      # standard library used for the build, so CI needs the latest patch.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Build
        run: go build ./...

      # A 32-bit target as well. Nothing else here builds one, and the class of
      # bug this guards against — a constant that does not fit a 32-bit int —
      # is a compile error rather than a test failure, so only a build of such
      # a target catches it. f4 ships linux/arm, mips and mipsle.
      #
      # Cross-compilation, so one runner is enough.
      - name: Build for a 32-bit target
        if: matrix.os == 'ubuntu-latest'
        run: GOOS=linux GOARCH=arm go build ./...

      - name: Vet
        env:
          # Every Win32 pointer this package touches arrives as a uintptr from
          # a syscall.Proc.Call return or a COM vtable argument -- GlobalLock's
          # address, the DIB bit buffer, the IDropTarget "this" -- and turning
          # one back into an unsafe.Pointer is the only way to read it without
          # cgo. unsafeptr cannot tell those apart from the real bug it looks
          # for, an unsafe.Pointer built out of an integer that was never an
          # address, so it flags all forty-odd of them. The rest of vet still
          # runs, on Windows as everywhere else.
          VETFLAGS: ${{ matrix.os == 'windows-latest' && '-unsafeptr=false' || '' }}
        run: go vet ${VETFLAGS:+"$VETFLAGS"} ./...

      # Vulnerability and workflow checks read the same files on every runner,
      # so install and run them only once.
      - name: Install module and workflow checks
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Scan for reachable Go vulnerabilities
        if: matrix.os == 'ubuntu-latest'
        run: govulncheck ./...

      - name: Lint GitHub Actions workflows
        if: matrix.os == 'ubuntu-latest'
        run: actionlint .github/workflows/*.yml

      # Lint reads the same sources on every runner, so it runs on one.
      - name: Incremental golangci-lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.1
          args: --new-from-rev=origin/main

      # The race detector remains disabled until the existing Far2l,
      # frame-manager and protocol teardown races are fixed. Enabling it here
      # before that would make this workflow fail for the current baseline.
      #
      # The two skipped tests drive fm.Run with a reader on os.Stdin and rely
      # on Run returning when stdin hits EOF. That holds on Windows, but on
      # the macOS runner the event channel never closes and the whole suite
      # hangs until the go test timeout. They stay skipped everywhere for now
      # so the skip set does not vary by platform; unskip once fm.Run's exit
      # no longer depends on platform stdin semantics.
      - name: Test
        run: >
          go test -count=1 -timeout 4m
          -skip 'TestFrameManager_MenuBarNavigabilityWithSubMenu|TestFrameManager_ModalDialogBlocksF9'
          ./...

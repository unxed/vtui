name: CI

on:
  push:
  pull_request:

# A push fans out into more than forty checks, and only the latest queued run
# for a branch and event is useful. Preserve every main run: its history must
# never be interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each cell is a native OS and architecture pair. Both architectures
        # are required because goffi implements their calling conventions
        # separately.
        include:
          - { os: ubuntu-latest,    target: linux/amd64 }
          - { os: ubuntu-24.04-arm, target: linux/arm64 }
          - { os: macos-latest,     target: darwin/arm64 }
          - { os: macos-15-intel,   target: darwin/amd64 }
          - { os: windows-latest,   target: windows/amd64 }
          - { os: windows-11-arm,   target: windows/arm64 }
    env:
      # vtui is a cgo-free project: every backend reaches libc, X11, Wayland
      # and the GPU through goffi rather than through a C toolchain. Pinning
      # this keeps all six runners on the same configuration instead of
      # letting each one decide by whether it happens to ship a compiler --
      # and it is what keeps bindings/c/cabi, the one cgo package in the
      # tree, out of a build that is not asking for the C bindings.
      CGO_ENABLED: 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Test
        run: go test -count=1 -timeout 4m ./...

  race:
    name: Race
    runs-on: ubuntu-latest
    env:
      # The rest of this workflow intentionally keeps cgo disabled. Enabling
      # it here does not reverse that decision: the race detector requires it.
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - run: go test -race -count=1 -timeout 15m ./...

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      # go.mod sets the minimum language version, while govulncheck checks the
      # standard library used for the build, so CI needs the latest patch.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.1
          args: --new-from-rev=origin/main

  build:
    name: Build (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux/amd64
            goos: linux
            goarch: amd64
            tags: ''
            gcflags: ''
          - label: linux/arm64
            goos: linux
            goarch: arm64
            tags: ''
            gcflags: ''
          - label: linux/arm
            goos: linux
            goarch: arm
            tags: ''
            gcflags: ''
          - label: windows/amd64
            goos: windows
            goarch: amd64
            tags: ''
            gcflags: ''
          - label: windows/arm64
            goos: windows
            goarch: arm64
            tags: ''
            gcflags: ''
          - label: darwin/amd64
            goos: darwin
            goarch: amd64
            tags: ''
            gcflags: ''
          - label: darwin/arm64
            goos: darwin
            goarch: arm64
            tags: ''
            gcflags: ''
          - label: dragonfly/amd64
            goos: dragonfly
            goarch: amd64
            tags: ''
            gcflags: ''
          - label: openbsd/amd64
            goos: openbsd
            goarch: amd64
            tags: ''
            gcflags: ''
          - label: openbsd/arm64
            goos: openbsd
            goarch: arm64
            tags: ''
            gcflags: ''
          - label: netbsd/amd64
            goos: netbsd
            goarch: amd64
            tags: ''
            gcflags: -gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std
          - label: netbsd/arm64
            goos: netbsd
            goarch: arm64
            tags: ''
            gcflags: -gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std
          - label: illumos/amd64
            goos: illumos
            goarch: amd64
            tags: ''
            gcflags: ''
          - label: solaris/amd64
            goos: solaris
            goarch: amd64
            tags: ''
            gcflags: ''
          - label: freebsd/amd64
            goos: freebsd
            goarch: amd64
            tags: ''
            gcflags: -gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std
          - label: freebsd/arm64
            goos: freebsd
            goarch: arm64
            tags: ''
            gcflags: -gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std
          - label: linux/386 noffi
            goos: linux
            goarch: '386'
            tags: -tags=noffi
            gcflags: ''
          - label: linux/mips noffi
            goos: linux
            goarch: mips
            tags: -tags=noffi
            gcflags: ''
          - label: linux/mipsle noffi
            goos: linux
            goarch: mipsle
            tags: -tags=noffi
            gcflags: ''
          - label: linux/mips64 noffi
            goos: linux
            goarch: mips64
            tags: -tags=noffi
            gcflags: ''
          - label: linux/mips64le noffi
            goos: linux
            goarch: mips64le
            tags: -tags=noffi
            gcflags: ''
          - label: linux/riscv64 noffi
            goos: linux
            goarch: riscv64
            tags: -tags=noffi
            gcflags: ''
          - label: linux/loong64 noffi
            goos: linux
            goarch: loong64
            tags: -tags=noffi
            gcflags: ''
          - label: linux/ppc64 noffi
            goos: linux
            goarch: ppc64
            tags: -tags=noffi
            gcflags: ''
          - label: linux/ppc64le noffi
            goos: linux
            goarch: ppc64le
            tags: -tags=noffi
            gcflags: ''
          - label: linux/amd64 goffi_musl
            goos: linux
            goarch: amd64
            tags: -tags=goffi_musl
            gcflags: -gcflags=github.com/go-webgpu/goffi/internal/dl=-std
          - label: linux/arm64 goffi_musl
            goos: linux
            goarch: arm64
            tags: -tags=goffi_musl
            gcflags: -gcflags=github.com/go-webgpu/goffi/internal/dl=-std
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      # These tags and compiler flags come from f4, not from configurations
      # vtui selects itself. f4 builds vtui statically, against musl, and with
      # stubs instead of goffi where purego does not implement the calling
      # convention, so CI exercises the exact downstream configurations.
      - name: Build
        run: go build ${{ matrix.tags }} ${{ matrix.gcflags }} ./...

  vet:
    name: Vet (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux/amd64
            goos: linux
            goarch: amd64
            tags: ''
            gcflags: ''
            vetflags: ''
          # Every Win32 pointer this package touches arrives as a uintptr from
          # a syscall.Proc.Call return or a COM vtable argument -- GlobalLock's
          # address, the DIB bit buffer, the IDropTarget "this" -- and turning
          # one back into an unsafe.Pointer is the only way to read it without
          # cgo. unsafeptr cannot tell those apart from the real bug it looks
          # for, an unsafe.Pointer built out of an integer that was never an
          # address, so it flags 33 valid conversions. The rest of vet still
          # runs on Windows.
          - label: windows/amd64
            goos: windows
            goarch: amd64
            tags: ''
            gcflags: ''
            vetflags: -unsafeptr=false
          - label: linux/arm goffi_static
            goos: linux
            goarch: arm
            tags: -tags=goffi_static
            gcflags: ''
            vetflags: ''
          - label: linux/amd64 goffi_musl
            goos: linux
            goarch: amd64
            tags: -tags=goffi_musl
            gcflags: -gcflags=github.com/go-webgpu/goffi/internal/dl=-std
            vetflags: ''
          - label: darwin/arm64
            goos: darwin
            goarch: arm64
            tags: ''
            gcflags: ''
            vetflags: ''
          - label: freebsd/amd64
            goos: freebsd
            goarch: amd64
            tags: ''
            gcflags: -gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std
            vetflags: ''
          - label: openbsd/amd64
            goos: openbsd
            goarch: amd64
            tags: ''
            gcflags: ''
            vetflags: ''
          - label: netbsd/amd64
            goos: netbsd
            goarch: amd64
            tags: ''
            gcflags: -gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std
            vetflags: ''
          - label: dragonfly/amd64
            goos: dragonfly
            goarch: amd64
            tags: ''
            gcflags: ''
            vetflags: ''
          - label: illumos/amd64
            goos: illumos
            goarch: amd64
            tags: ''
            gcflags: ''
            vetflags: ''
          - label: solaris/amd64
            goos: solaris
            goarch: amd64
            tags: ''
            gcflags: ''
            vetflags: ''
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      # f4's static and musl configurations, along with its target platforms,
      # make these downstream settings part of vtui's supported surface even
      # though vtui does not select them itself.
      - name: Vet
        run: go vet ${{ matrix.vetflags }} ${{ matrix.tags }} ${{ matrix.gcflags }} ./...
